name: color_fund
description: "Color Fund - Gamified Financial Goals Tracker (Clean Architecture & Production-Ready)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # State Management (Riverpod)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase Ecosystem
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_crashlytics: ^4.1.3

  # Payments & Monetization (Stripe)
  flutter_stripe: ^11.2.0

  # Security & Environment Config
  flutter_dotenv: ^5.2.1

  # Internationalization & Formatting
  intl: ^0.19.0

  # UI / Gamification & Visuals
  confetti: ^0.7.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/layouts/
