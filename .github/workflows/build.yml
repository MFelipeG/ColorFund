name: Build Android APK & QA Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test_and_build:
    name: QA Tests & Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform & Assets
        run: |
          cp .env.example .env
          flutter create . --platforms=android --org com.colorfund.app
          mkdir -p assets/images assets/layouts

      - name: Install Dependencies
        run: flutter pub get

      - name: Run QA Automated Tests
        run: flutter test --no-pub

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorFund-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
